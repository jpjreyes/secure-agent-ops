# Overrides for the OpenTelemetry Demo chart (version pinned in scripts/cluster.sh).
#
# 1. The chart sets only memory limits, so Kubernetes makes requests = limits (~9 GiB), which doesn't fit the 8 GiB
#    Colima VM. Limits stay as upstream (so OOM behavior and the faults stay realistic); requests are set to what the
#    services actually use at idle, so the scheduler can place everything.
# 2. The demo's AI shopping assistant (agent, chatbot, mcp) and the docs site are off: they postdate the demo version
#    ITBench's scenarios were recorded on, the agent needs an external LLM, and they'd add noise to the telemetry.

components:
  agent: {enabled: false}
  chatbot: {enabled: false}
  mcp: {enabled: false}
  telemetry-docs: {enabled: false}

  accounting:       {resources: {requests: {memory: 80Mi},  limits: {memory: 160Mi}}}
  ad:               {resources: {requests: {memory: 150Mi}, limits: {memory: 300Mi}}}
  cart:             {resources: {requests: {memory: 80Mi},  limits: {memory: 160Mi}}}
  checkout:         {resources: {requests: {memory: 20Mi},  limits: {memory: 32Mi}}}
  currency:         {resources: {requests: {memory: 10Mi},  limits: {memory: 20Mi}}}
  email:            {resources: {requests: {memory: 50Mi},  limits: {memory: 100Mi}}}
  fraud-detection:  {resources: {requests: {memory: 150Mi}, limits: {memory: 300Mi}}}
  frontend:         {resources: {requests: {memory: 120Mi}, limits: {memory: 250Mi}}}
  frontend-proxy:   {resources: {requests: {memory: 45Mi},  limits: {memory: 90Mi}}}
  image-provider:   {resources: {requests: {memory: 25Mi},  limits: {memory: 50Mi}}}
  # browser users run headless Chrome: ~1 CPU of the 4-CPU VM, which starved probes (collector restarts) and
  # slowed the API server. HTTP users (weight 9 of 10 upstream) generate the same service traffic.
  load-generator:
    resources: {requests: {memory: 300Mi}, limits: {memory: 1500Mi}}
    envOverrides:
      - {name: LOCUST_BROWSER_TRAFFIC_ENABLED, value: "false"}
  payment:          {resources: {requests: {memory: 70Mi},  limits: {memory: 140Mi}}}
  product-catalog:  {resources: {requests: {memory: 20Mi},  limits: {memory: 32Mi}}}
  quote:            {resources: {requests: {memory: 20Mi},  limits: {memory: 40Mi}}}
  recommendation:   {resources: {requests: {memory: 150Mi}, limits: {memory: 500Mi}}}
  shipping:         {resources: {requests: {memory: 10Mi},  limits: {memory: 20Mi}}}
  flagd:            {resources: {requests: {memory: 40Mi},  limits: {memory: 75Mi}}}
  kafka:            {resources: {requests: {memory: 400Mi}, limits: {memory: 700Mi}}}
  astronomy-db:     {resources: {requests: {memory: 50Mi},  limits: {memory: 100Mi}}}
  valkey-cart:      {resources: {requests: {memory: 10Mi},  limits: {memory: 20Mi}}}
  opamp-server:     {resources: {requests: {memory: 30Mi},  limits: {memory: 65Mi}}}

opentelemetry-collector:
  resources: {requests: {memory: 200Mi}, limits: {memory: 400Mi}}
  # the upstream probe (1 s timeout) killed the collector whenever the small VM was busy, losing telemetry
  livenessProbe: {timeoutSeconds: 5, failureThreshold: 6, periodSeconds: 15}
  readinessProbe: {timeoutSeconds: 5}
jaeger:
  jaeger:
    resources: {requests: {memory: 300Mi}, limits: {memory: 600Mi}}
# 3. Prometheus: 30 s scrape, 15 s rule evaluation (faults show up within a minute; 15 s scrapes kept Prometheus and
#    the kubelet at ~1.7 CPUs on the 4-CPU VM) and the two service alerts ITBench-AA's
#    environment fires (same names, labels and description format), so live incidents look like the benchmark's.
prometheus:
  server:
    resources: {requests: {memory: 256Mi}, limits: {memory: 512Mi}}
    global:
      scrape_interval: 30s
      evaluation_interval: 15s
      scrape_timeout: 10s
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: otel-demo-services
          rules:
            - alert: RequestErrorRate
              expr: |
                sum by (service_name, namespace) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m]))
                  / sum by (service_name, namespace) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[2m])) > 0
              for: 30s
              labels: {severity: warning, namespace: otel-demo}
              annotations:
                description: "Request error rate in service {{ $labels.service_name }} in namespace otel-demo is above 0 (current: {{ $value }})"
            - alert: RequestLatency
              expr: |
                histogram_quantile(0.95, sum by (le, service_name, namespace) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[2m]))) > 1500
              for: 30s
              labels: {severity: warning, namespace: otel-demo}
              annotations:
                description: "Latency in service {{ $labels.service_name }} in namespace otel-demo is above 1500ms (current: {{ $value }}ms)"
# 4. Grafana off: agents query Prometheus/Jaeger/OpenSearch directly, and Grafana used ~1 CPU of the 4-CPU VM.
grafana:
  enabled: false
opensearch:
  resources: {requests: {memory: 700Mi}, limits: {memory: 1100Mi}}

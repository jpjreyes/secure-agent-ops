# Postgres for the LangGraph checkpointer (durable agent-team state). Local only, loopback, high port.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sao
      POSTGRES_PASSWORD: sao-local-only
      POSTGRES_DB: sao
    ports: ["127.0.0.1:55436:5432"]
    volumes: [sao-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sao -d sao"]
      interval: 30s
      start_period: 20s
      start_interval: 1s
      retries: 30
    mem_limit: 256m
volumes:
  sao-pg: {}

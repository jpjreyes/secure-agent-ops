[project]
name = "secure-agent-ops"
version = "0.1.0"
description = "Multi-agent incident response behind an MCP security gateway"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "duckdb>=2.0.0",
    "huggingface-hub>=0.26",
    "mcp>=2.3.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sao"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

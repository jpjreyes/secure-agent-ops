[project]
name = "secure-agent-ops"
version = "0.1.0"
description = "Multi-agent incident response behind an MCP security gateway"
requires-python = ">=3.12"
dependencies = [
    "cedarpy>=4.12.2",
    "claude-agent-sdk>=0.2.180",
    "cryptography>=44",
    "duckdb>=2.0.0",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mangum>=0.22.0",
    "mcp>=2.3.0",
    "opentelemetry-api>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "psycopg[binary,pool]>=3.3.9",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.44.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]  # small lambdas as local helpers are fine

[tool.ruff.lint.per-file-ignores]
"src/sao/agents/prompts.py" = ["E501"]  # Artificial Analysis' task prompt, verbatim

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sao"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
